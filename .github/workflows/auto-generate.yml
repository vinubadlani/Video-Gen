name: Auto-Generate & Post YouTube Short

# ─── Schedule (IST = UTC+5:30) ───────────────────────────────────────────────
on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST  (04:30 UTC)
    - cron: '5 15 * * *'   # 08:35 PM IST  (15:05 UTC)
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to generate (leave blank for random)'
        required: false
        default: ''

jobs:
  generate-and-post:
    name: Generate Video & Post to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 24 (avoids Node 20 deprecation warnings) ─────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Install Chrome (required by Remotion renderer) ────────────────────
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable
          google-chrome-stable --version

      # ── 4. Install npm dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Create output directory ───────────────────────────────────────────
      - name: Prepare output directory
        run: mkdir -p output public

      # ── 6. Run the pipeline ───────────────────────────────────────────────────
      - name: Generate video & upload to YouTube
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -z "$TOPIC" ]; then
            node scripts/autoGenerate.js
          else
            node scripts/autoGenerate.js "$TOPIC"
          fi
        env:
          GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY:          ${{ secrets.ELEVENLABS_API_KEY }}
          # ELEVENLABS_VOICE_ID is optional — falls back to a free built-in voice
          ELEVENLABS_VOICE_ID:         ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID:           ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:       ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:       ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY:             public
          # Chrome installed above; stable binary path on ubuntu-latest
          REMOTION_CHROME_EXECUTABLE:  /usr/bin/google-chrome-stable

      # ── 7. Upload the rendered MP4 as a build artifact (optional, 1-day keep) ─
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 1
